# Native squash auto-merge for non-draft pull requests from solly-agent or jsolly.
# Arms GitHub auto-merge with AUTO_MERGE_TOKEN. A draft holds the pull request.
# Every 30 minutes, and on manual dispatch, re-arm an eligible pull request that
# is not armed, and squash-merge one whose required ci and security checks are
# already green. Never checks out a pull request and never falls back to GITHUB_TOKEN.
# No third-party actions are used, so there is no checkout and no action SHA to pin.

name: Auto-merge

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions: {}

# pull_request refs are refs/pull/<number>/merge, so each pull request has its own group.
# schedule and workflow_dispatch share refs/heads/main and therefore one sweep group.
concurrency:
  group: auto-merge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  auto-merge:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Arm native auto-merge or sweep eligible pull requests
        env:
          AUTO_MERGE_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          repo="${GITHUB_REPOSITORY:-}"
          [[ "$repo" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || {
            echo "::error::unexpected repository name"
            exit 1
          }
          summary_file="${GITHUB_STEP_SUMMARY:-}"

          add_summary() {
            [[ -n "$summary_file" ]] || return 0
            printf '%s\n' "$1" >>"$summary_file"
          }

          flatten_notice() {
            printf '%s' "$1" | tr '\n\r' '  ' | sed -E 's/(ghs_|ghp_|gho_|github_pat_)[A-Za-z0-9_]+/[redacted]/g' | head -c 500
          }

          record_notice() {
            local number="$1"
            local message
            message="$(flatten_notice "$2")"
            echo "::notice::PR #${number}: ${message}"
            add_summary "PR #${number}: ${message}"
          }

          require_token() {
            if [[ -z "${AUTO_MERGE_TOKEN//[[:space:]]/}" ]]; then
              echo "::error::AUTO_MERGE_TOKEN secret is not configured. Refusing to fall back to GITHUB_TOKEN."
              exit 1
            fi
            unset GITHUB_TOKEN
            export GH_TOKEN="${AUTO_MERGE_TOKEN}"
            export GH_PROMPT_DISABLED=1
            export GH_NO_UPDATE_NOTIFIER=1
          }

          is_auth_error() {
            local lower
            lower="$(printf '%s' "$1" | tr '[:upper:]' '[:lower:]')"
            case "$lower" in
              *"bad credentials"*|*"resource not accessible"*|*"requires authentication"*|*"http 401"*|*"http 403"*)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          is_benign_merge_message() {
            local lower
            lower="$(printf '%s' "$1" | tr '[:upper:]' '[:lower:]')"
            case "$lower" in
              *"already enabled"*|*"already merged"*|*"clean status"*)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          # Print sha, url, and armed (yes/no) when the pull request passes the gate.
          eligible_fields() {
            local pr_json="$1"
            local state draft author head base sha url armed number
            IFS=$'\t' read -r state draft author head base sha url armed number < <(
              jq -r '[
                (.state // ""),
                (.draft | tostring),
                (.user.login // ""),
                (.head.repo.full_name // ""),
                (.base.repo.full_name // ""),
                (.head.sha // ""),
                (.html_url // ""),
                (if .auto_merge == null then "no" else "yes" end),
                (.number | tostring)
              ] | @tsv' <<<"$pr_json"
            ) || return 1
            [[ "$state" == "open" && "$draft" == "false" ]] || return 1
            case "$author" in
              solly-agent|jsolly) ;;
              *) return 1 ;;
            esac
            [[ "$head" == "$repo" && "$base" == "$repo" ]] || return 1
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || return 1
            [[ "$number" =~ ^[0-9]+$ ]] || return 1
            [[ "$url" == "https://github.com/${repo}/pull/${number}" ]] || return 1
            [[ "$armed" == "yes" || "$armed" == "no" ]] || return 1
            printf '%s\t%s\t%s\n' "$sha" "$url" "$armed"
          }

          skip_reason() {
            local pr_json="$1"
            local state draft author head base
            state="$(jq -r '.state // ""' <<<"$pr_json")"
            draft="$(jq -r '.draft | tostring' <<<"$pr_json")"
            author="$(jq -r '.user.login // ""' <<<"$pr_json")"
            head="$(jq -r '.head.repo.full_name // ""' <<<"$pr_json")"
            base="$(jq -r '.base.repo.full_name // ""' <<<"$pr_json")"
            if [[ "$state" != "open" ]]; then
              printf 'state is %s' "$state"
            elif [[ "$draft" != "false" ]]; then
              printf 'draft'
            elif [[ "$author" != "solly-agent" && "$author" != "jsolly" ]]; then
              printf 'author %s is not allowlisted' "${author:-unknown}"
            elif [[ "$head" != "$repo" || "$base" != "$repo" ]]; then
              printf 'head repository %s does not match %s' "${head:-unknown}" "$repo"
            else
              printf 'failed the merge gate'
            fi
          }

          fetch_pr() {
            local number="$1"
            local errfile
            errfile="$(mktemp)"
            if ! gh api "repos/${repo}/pulls/${number}" >"$2" 2>"$errfile"; then
              if is_auth_error "$(cat "$errfile")"; then
                echo "::error::GitHub rejected AUTO_MERGE_TOKEN while reading PR #${number}."
                rm -f "$errfile"
                exit 1
              fi
              record_notice "$number" "$(cat "$errfile")"
              rm -f "$errfile"
              return 1
            fi
            rm -f "$errfile"
          }

          # Return 0 when the latest check run of this exact name succeeded.
          # Return 1 when it is missing or not green. Return 2 on transport/API failure.
          check_green() {
            local sha="$1"
            local name="$2"
            local filter listing latest status conclusion errfile
            case "$name" in
              ci) filter='.check_runs[] | select(.name == "ci") | [.id, .status, (.conclusion // "")] | @tsv' ;;
              security) filter='.check_runs[] | select(.name == "security") | [.id, .status, (.conclusion // "")] | @tsv' ;;
              *)
                echo "::error::unexpected check name"
                exit 1
                ;;
            esac
            errfile="$(mktemp)"
            if ! listing="$(gh api --paginate "repos/${repo}/commits/${sha}/check-runs?per_page=100" --jq "$filter" 2>"$errfile")"; then
              cat "$errfile" >>"$CHECK_ERROR_FILE"
              rm -f "$errfile"
              return 2
            fi
            rm -f "$errfile"
            latest="$(printf '%s\n' "$listing" | awk 'NF { print }' | sort -n | tail -n 1)"
            [[ -n "$latest" ]] || return 1
            status="$(printf '%s' "$latest" | cut -f2)"
            conclusion="$(printf '%s' "$latest" | cut -f3)"
            [[ "$status" == "completed" && "$conclusion" == "success" ]]
          }

          # A check-run read failure must not direct-merge. The caller still arms auto-merge.
          required_checks_green() {
            local sha="$1"
            local ci_status=0
            local security_status=0
            CHECK_ERROR_FILE="$(mktemp)"
            : >"$CHECK_ERROR_FILE"
            # `||` keeps a non-zero check from aborting under `set -e`.
            check_green "$sha" ci || ci_status=$?
            check_green "$sha" security || security_status=$?
            if [[ "$ci_status" -eq 2 || "$security_status" -eq 2 ]]; then
              LAST_CHECK_ERROR="$(cat "$CHECK_ERROR_FILE")"
              rm -f "$CHECK_ERROR_FILE"
              return 2
            fi
            rm -f "$CHECK_ERROR_FILE"
            if [[ "$ci_status" -eq 0 && "$security_status" -eq 0 ]]; then
              return 0
            fi
            return 1
          }

          arm_auto_merge() {
            local number="$1"
            local url="$2"
            local output status
            set +e
            output="$(gh pr merge --auto --squash "$url" 2>&1)"
            status=$?
            set -e
            if [[ "$status" -eq 0 ]]; then
              printf '%s\n' "$(flatten_notice "$output")"
              echo "Armed auto-merge for PR #${number}."
              return 0
            fi
            if is_benign_merge_message "$output"; then
              printf '%s\n' "$(flatten_notice "$output")"
              if printf '%s' "$output" | tr '[:upper:]' '[:lower:]' | grep -q 'clean status'; then
                echo "PR #${number} is in clean status; the sweep squash-merges it when ci and security are green."
              else
                echo "PR #${number} already has auto-merge armed or is already merged."
              fi
              return 0
            fi
            printf '%s' "$output"
            return 1
          }

          direct_merge() {
            local url="$1"
            local sha="$2"
            local output status lower
            set +e
            output="$(gh pr merge --squash --match-head-commit "$sha" "$url" 2>&1)"
            status=$?
            set -e
            lower="$(printf '%s' "$output" | tr '[:upper:]' '[:lower:]')"
            if [[ "$status" -eq 0 || "$lower" == *"already merged"* ]]; then
              printf '%s\n' "$(flatten_notice "$output")"
              return 0
            fi
            printf '%s' "$output"
            return 1
          }

          case "${GITHUB_EVENT_NAME:-}" in
            pull_request)
              [[ -f "${GITHUB_EVENT_PATH:-}" ]] || {
                echo "::error::GITHUB_EVENT_PATH is missing"
                exit 1
              }
              if ! jq -e '.pull_request | type == "object"' "$GITHUB_EVENT_PATH" >/dev/null; then
                echo "::error::pull_request payload is missing"
                exit 1
              fi
              event_pr="$(jq -c '.pull_request' "$GITHUB_EVENT_PATH")"
              number="$(jq -r '.number // ""' <<<"$event_pr")"
              if ! fields="$(eligible_fields "$event_pr")"; then
                echo "Skipping pull request ${number:-unknown}: $(skip_reason "$event_pr")"
                exit 0
              fi
              require_token
              [[ "$number" =~ ^[0-9]+$ ]] || {
                echo "::error::pull request number is missing"
                exit 1
              }
              pr_file="$(mktemp)"
              fetch_pr "$number" "$pr_file" || {
                echo "::error::could not re-read PR #${number} before arming auto-merge"
                exit 1
              }
              pr_json="$(cat "$pr_file")"
              rm -f "$pr_file"
              if ! fields="$(eligible_fields "$pr_json")"; then
                echo "Skipping pull request #${number} after re-read: $(skip_reason "$pr_json")"
                exit 0
              fi
              url="$(printf '%s' "$fields" | cut -f2)"
              if message="$(arm_auto_merge "$number" "$url")"; then
                printf '%s\n' "$message"
              else
                record_notice "$number" "$message"
                echo "::error::could not arm auto-merge for PR #${number}"
                exit 1
              fi
              ;;
            schedule|workflow_dispatch)
              require_token
              add_summary "## Auto-merge sweep"
              add_summary ""
              errfile="$(mktemp)"
              if ! numbers="$(gh api --paginate "repos/${repo}/pulls?state=open&per_page=100" --jq '.[].number' 2>"$errfile")"; then
                echo "::error::could not list open pull requests: $(flatten_notice "$(cat "$errfile")")"
                rm -f "$errfile"
                exit 1
              fi
              rm -f "$errfile"
              while IFS= read -r number; do
                [[ "$number" =~ ^[0-9]+$ ]] || continue
                pr_file="$(mktemp)"
                if ! fetch_pr "$number" "$pr_file"; then
                  rm -f "$pr_file"
                  continue
                fi
                pr_json="$(cat "$pr_file")"
                rm -f "$pr_file"
                if ! fields="$(eligible_fields "$pr_json")"; then
                  echo "Skipping PR #${number}: $(skip_reason "$pr_json")"
                  continue
                fi
                sha="$(printf '%s' "$fields" | cut -f1)"
                url="$(printf '%s' "$fields" | cut -f2)"
                armed="$(printf '%s' "$fields" | cut -f3)"
                green_status=0
                required_checks_green "$sha" || green_status=$?
                if [[ "$green_status" -eq 2 ]]; then
                  record_notice "$number" "could not read ci and security check runs; not squash-merging directly. ${LAST_CHECK_ERROR:-}"
                elif [[ "$green_status" -eq 0 ]]; then
                  pr_file="$(mktemp)"
                  if ! fetch_pr "$number" "$pr_file"; then
                    rm -f "$pr_file"
                    continue
                  fi
                  pr_json="$(cat "$pr_file")"
                  rm -f "$pr_file"
                  if ! fresh="$(eligible_fields "$pr_json")"; then
                    echo "PR #${number} changed before merge: $(skip_reason "$pr_json")"
                    continue
                  fi
                  fresh_sha="$(printf '%s' "$fresh" | cut -f1)"
                  if [[ "$fresh_sha" != "$sha" ]]; then
                    echo "PR #${number} head moved before merge; the next sweep retries."
                    continue
                  fi
                  if message="$(direct_merge "$url" "$sha")"; then
                    printf '%s\n' "$message"
                    echo "Squash-merged PR #${number} at ${sha}."
                    add_summary "Squash-merged PR #${number} at ${sha}."
                  elif is_auth_error "$message"; then
                    echo "::error::GitHub rejected AUTO_MERGE_TOKEN while merging PR #${number}."
                    exit 1
                  else
                    record_notice "$number" "$message"
                  fi
                  continue
                fi
                if [[ "$armed" == "yes" ]]; then
                  echo "PR #${number} already has auto-merge armed; ci and security are not both green yet."
                  continue
                fi
                if message="$(arm_auto_merge "$number" "$url")"; then
                  printf '%s\n' "$message"
                elif is_auth_error "$message"; then
                  echo "::error::GitHub rejected AUTO_MERGE_TOKEN while arming PR #${number}."
                  exit 1
                else
                  record_notice "$number" "$message"
                fi
              done <<<"$numbers"
              ;;
            *)
              echo "::error::unexpected event ${GITHUB_EVENT_NAME:-unknown}"
              exit 1
              ;;
          esac
