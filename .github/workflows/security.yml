name: Security
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: >-
    ${{ (github.event_name != 'pull_request' ||
    (github.event.action != 'labeled' && github.event.pull_request.user.login != 'dependabot[bot]') ||
    (github.event.action == 'labeled' && github.event.label.name == 'ow-ci')) && format('security-{0}', github.event.pull_request.number || github.ref) || format('security-deferred-{0}', github.run_id) }}
  cancel-in-progress: true
jobs:
  security:
    name: >-
      ${{ (github.event_name != 'pull_request' ||
      (github.event.action != 'labeled' && github.event.pull_request.user.login != 'dependabot[bot]') ||
      (github.event.action == 'labeled' && github.event.label.name == 'ow-ci')) && 'security' || 'security-deferred' }}
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action != 'labeled' && github.event.pull_request.user.login != 'dependabot[bot]') ||
      (github.event.action == 'labeled' && github.event.label.name == 'ow-ci')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.22"
          enable-cache: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.9.12
      - name: Workflow, source and dependency scans
        run: python3 -I gate/security-scan.py ci
