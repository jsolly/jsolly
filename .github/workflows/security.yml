name: Security
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: >-
    ${{ (github.event_name != 'pull_request' ||
    (github.event.action != 'labeled' && github.event.pull_request.user.login != 'dependabot[bot]') ||
    (github.event.action == 'labeled' && github.event.label.name == 'ow-ci')) && format('security-{0}', github.event.pull_request.number || github.ref) || format('security-deferred-{0}', github.run_id) }}
  cancel-in-progress: true
jobs:
  security:
    name: >-
      ${{ (github.event_name != 'pull_request' ||
      (github.event.action != 'labeled' && github.event.pull_request.user.login != 'dependabot[bot]') ||
      (github.event.action == 'labeled' && github.event.label.name == 'ow-ci')) && 'security' || 'security-deferred' }}
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action != 'labeled' && github.event.pull_request.user.login != 'dependabot[bot]') ||
      (github.event.action == 'labeled' && github.event.label.name == 'ow-ci')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.22"
          enable-cache: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.9.12
      - name: Workflow, source and dependency scans
        run: python3 -I gate/security-scan.py ci
